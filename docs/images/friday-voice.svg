<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 180" width="720" height="180" role="img" aria-label="Friday's voice: a glowing orb with sound waves">
  <defs>
    <linearGradient id="wave" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#38d6f5"/>
      <stop offset="1" stop-color="#0b7fab"/>
    </linearGradient>
    <radialGradient id="core" cx="38%" cy="32%" r="78%">
      <stop offset="0" stop-color="#e8fbff"/>
      <stop offset="0.38" stop-color="#47d4f2"/>
      <stop offset="1" stop-color="#0a6f9a"/>
    </radialGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#22c3e6" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#22c3e6" stop-opacity="0"/>
    </radialGradient>
    <style>
      .bar { transform-box: fill-box; transform-origin: center; animation: talk 1.1s ease-in-out infinite alternate; }
      .ring { fill: none; stroke: #22b8dc; stroke-width: 1.5; transform-box: fill-box; transform-origin: center; animation: ripple 3.3s ease-out infinite; }
      .breathe { transform-box: fill-box; transform-origin: center; animation: breathe 2.2s ease-in-out infinite alternate; }
      .orbit { transform-origin: 360px 90px; animation: spin 5s linear infinite; }
      .orbit.back { animation-duration: 8s; animation-direction: reverse; }
      @keyframes talk { from { transform: scaleY(0.22); } to { transform: scaleY(1); } }
      @keyframes ripple { from { transform: scale(0.9); opacity: 0.75; } to { transform: scale(2.3); opacity: 0; } }
      @keyframes breathe { from { transform: scale(0.93); } to { transform: scale(1.07); } }
      @keyframes spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) { .bar, .ring, .breathe, .orbit { animation: none; } }
    </style>
  </defs>
  <circle cx="360" cy="90" r="86" fill="url(#glow)"/>
