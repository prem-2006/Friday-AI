[project]
name = "friday-browser-agent"
version = "0.1.0"
description = "Navigator's engine: browser-use driving the on-screen Chrome that friday/services opened. Kept in its own environment because browser-use pins exact versions of libraries friday/services also uses."
requires-python = ">=3.12,<3.13"
license = "MIT"
dependencies = [
    "browser-use==0.13.11",
]

[dependency-groups]
dev = ["pytest>=9.1.1"]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"
